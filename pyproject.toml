[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flavfinder-core"
version = "0.1.0"
description = "Independent, code-only port of the flavfinder MS/MS flavonoid classifier"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Lvjun Guo", email = "gljx898989@163.com" },
  { name = "David Niteas", email = "david.ql.d@foxmail.com" },
]
keywords = ["mass spectrometry", "MS/MS", "flavonoids", "metabolomics", "cheminformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<6",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
autogluon = ["autogluon.tabular[all]>=1.0,<2"]
lightgbm = ["lightgbm>=4.0"]
dev = [
  "hatchling>=1.25",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
flavfinder = "flavfinder.cli:main"

[project.urls]
Homepage = "https://github.com/DavidNiteas/flavfinder-core"
Original = "https://github.com/Ficere/flavfinder"

[tool.hatch.build.targets.wheel]
packages = ["src/flavfinder"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/configs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/AUTHORS",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/Makefile",
  "/Dockerfile",
  "/.dockerignore",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src/flavfinder"]
warn_unused_ignores = true
ignore_missing_imports = true
